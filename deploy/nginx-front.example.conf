# 무사배포 기원소 — 서버에 이미 있는 nginx(앞단, 80/443)가 기원소로 넘기는 설정 예시.
#
# 기원소는 docker-compose.behind-proxy.yml로 띄워 172.17.0.1:8111에서 평문 HTTP로 받습니다
# (.env의 SHRINE_PROXY_BIND · SHRINE_PROXY_PORT를 바꿨다면 아래 proxy_pass도 같이). 절차는 deploy/README.md 13장.
#
# shrine.example.com을 .env의 SHRINE_DOMAIN으로 모두 바꿉니다. 인증서가 아직 없으면 3)의 server 블록은 빼고
# 1) · 2)만 넣어 인증서를 먼저 받습니다 (없는 인증서 파일을 가리키면 nginx -t가 실패합니다).
#
# 앞단이 하는 일은 https 받기 · 인증서 · 넘기기뿐입니다. 보안 헤더(HSTS · CSP 등) · 경로별 요청 크기 상한 · 접속 기록 ·
# '잠시 정비 중' 화면은 뒤의 Caddy와 앱이 하므로 여기서 더하지 않습니다 (add_header로 겹치면 헤더가 두 번 붙습니다).


# ── 1) http{} 단계에 한 번만: WebSocket 업그레이드 ──────────────────────────────
# map은 server{} 안에 둘 수 없고 http{} 단계에 있어야 합니다. conf.d/*.conf가 http{} 안에서 include되는 보통 구성이면
# 이 파일에 그대로 두면 됩니다. 앞단 설정에 같은 이름의 map이 이미 있으면 이 블록은 지우고 그것을 씁니다
# (확인: grep -rn connection_upgrade <앞단 nginx 설정 폴더>. 두 벌을 두면 어느 쪽 값이 쓰일지 헷갈립니다).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ── 2) 80: 인증서 발급 확인(webroot) + https로 넘기기 ─────────────────────────────
server {
    listen 80;
    # 다른 사이트 설정에 listen [::]:80; 이 있으면 같이 넣습니다
    server_name shrine.example.com;

    server_tokens off;
    access_log off;

    # Let's Encrypt HTTP-01 확인 파일. root 경로는 지금 서버의 다른 사이트 설정과 같게 맞춥니다
    # (certbot 컨테이너와 같이 쓰는 webroot 폴더가 nginx 컨테이너 안에서 보이는 경로)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── 3) 443: https를 받아 기원소(Caddy)로 넘기기 ───────────────────────────────────
server {
    listen 443 ssl;
    # 다른 사이트 설정에 listen [::]:443 ssl; 이 있으면 같이 넣습니다
    # nginx 1.25.1 이상: http2는 이 지시어로 켭니다 (그보다 오래된 nginx면 listen 443 ssl http2;)
    http2 on;
    server_name shrine.example.com;

    # 인증서 경로: 이 서버의 certbot이 쓰는 경로와 같게 (nginx 컨테이너 안에서 보이는 경로)
    ssl_certificate     /etc/letsencrypt/live/shrine.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shrine.example.com/privkey.pem;
    # 다른 사이트가 쓰는 공통 TLS 설정(include … options-ssl-nginx.conf, ssl_dhparam 등)이 있으면 같이 넣습니다

    server_tokens off;

    # 접속 기록을 남기지 않습니다. 기원소 안의 Caddy가 IP 일부를 가린 기록을 30일만 둡니다 (개인정보 처리방침).
    # 앞단이 이 사이트 방문자의 원래 IP를 따로 쌓으면 처리방침과 어긋나므로 끕니다.
    access_log off;
    # nginx 오류 기록(error_log)에도 'client: <IP>'가 붙습니다. 서버 공통 error_log를 오래 쌓는다면 이 사이트만 줄입니다
    # error_log /var/log/nginx/error.log crit;

    # 요청 본문 상한. 앱 상한(등록소 이미지 5MiB, 운영자 화면 이미지 JSON 약 7MB)보다 조금 크게.
    # 경로별 상한은 뒤의 Caddy가 다시 막습니다 (나머지 경로 16KB 등)
    client_max_body_size 8m;

    location / {
        proxy_pass http://172.17.0.1:8111;
        proxy_http_version 1.1;

        # WebSocket(/ws). 1)의 map이 있어야 합니다
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 앱이 Host로 운영자 쿠키(Secure)를 정하고, 출처 확인은 .env의 PUBLIC_ORIGIN과 비교합니다
        proxy_set_header Host $host;
        # 중요: X-Forwarded-For는 $remote_addr(이 nginx에 직접 붙은 방문자 IP) 하나로 덮어씁니다.
        #   $proxy_add_x_forwarded_for를 쓰지 않습니다. 그건 방문자가 보낸 X-Forwarded-For 뒤에 덧붙이는 것이라,
        #   방문자가 앞 값을 마음대로 적어 IP를 꾸미고 IP별 제한 · 차단 · ADMIN_IPS를 비켜 갈 수 있습니다.
        #   (뒤의 Caddy도 trusted_proxies_strict로 오른쪽부터 읽지만, 앞단에서 먼저 값을 하나로 만듭니다)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 실시간 연결(WebSocket)은 앱이 25초마다 ping을 보내므로 120초 안에 끊기지 않습니다.
        # 일반 요청도 이 안에 끝납니다
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # proxy_buffering은 기본(on) 그대로 둡니다: 앱에 스트리밍 응답(SSE 등)이 없고, WebSocket은 업그레이드된 뒤
        # 버퍼와 상관없이 바로 오갑니다. 느린 방문자의 응답은 nginx가 받아 두어 뒤의 연결이 빨리 풀립니다.
    }
}
