# Musabaepo shrine DB schema (Alembic). The server runs "upgrade head" by itself on start.
# Keep this file ASCII only: Alembic reads it with the OS locale encoding (cp949 on Korean Windows).
# Manual use (from the app/ folder):
#   DATABASE_URL=postgresql://... uv run alembic upgrade head
#   DATABASE_URL=postgresql://... uv run alembic revision --autogenerate -m "what changed"
# The connection URL is never written here; alembic/env.py reads DATABASE_URL only.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
