[project]
name = "musabaepo-shrine"
version = "0.1.0"
description = "무사배포 기원소 서버 (FastAPI · PostgreSQL · Redis)"
requires-python = ">=3.13,<3.14"
license = { file = "../LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "regex>=2024.11.6",
  "idna>=3.10",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shrine"]
