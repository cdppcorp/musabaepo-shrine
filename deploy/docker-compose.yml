# 무사배포 기원소 단독 서버 구성 (앱 + Caddy). 다른 서비스와 코드 · DB를 나눠 쓰지 않습니다.
#   cp .env.example .env  (값 채우기)  →  cd deploy && mkdir -p backups && sudo chown 1000:1000 backups
#   →  docker compose up -d --build
# 첫 배포 · 업데이트 · 롤백 · 백업 · 복구 · 서버 옮기기는 deploy/README.md에 적어 두었습니다.

# 로그: Docker 기본(json-file)은 크기 제한이 없습니다. 컨테이너마다 10MB × 5개까지만 둡니다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  shrine:
    build: ..
    # 빌드한 이미지 이름. 롤백할 때는 이전 이미지에 이 이름을 다시 붙입니다 (README '롤백')
    image: musabaepo-shrine:latest
    restart: unless-stopped
    # 신호 전달 · 좀비 프로세스 정리 (헬스 체크가 wget을 자주 띄웁니다)
    init: true
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3300
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      # 앱은 Caddy 뒤에서만 받습니다 (포트를 바깥에 열지 않음)
      TRUST_PROXY: "true"
    volumes:
      - shrine-data:/app/data
      # 백업(server/backup.ts)이 쌓이는 곳 = 호스트의 deploy/backups. 컨테이너 사용자(1000)가 쓸 수 있어야 합니다
      - ./backups:/app/backups
    expose:
      - "3300"
    # 헬스 체크는 Dockerfile의 HEALTHCHECK(GET /healthz)를 씁니다
    # 강화: 코드 · 시스템은 읽기 전용, 쓰는 곳은 데이터 · 백업 볼륨과 /tmp뿐. 권한 상승 없음
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    # 종료 신호를 받고 접속 정리 · DB 닫기를 마칠 시간
    stop_grace_period: 15s
    logging: *logging

  caddy:
    # 2.11 이상: 접속 기록을 날짜로 넘기는 roll_interval이 있고, Caddyfile의 오타를 조용히 넘기지 않습니다
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC)
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서 · ACME 계정. 서버를 옮길 때 같이 옮깁니다 (재발급 횟수 제한)
      - caddy-data:/data
      - caddy-config:/config
      # 접속 기록 (IP 일부 가림, 30일 안에 지움: Caddyfile 'log'). 서버를 옮길 때 가져가지 않습니다
      - caddy-logs:/var/log/caddy
    # Caddyfile의 {$SHRINE_DOMAIN} · {$ACME_EMAIL}
    env_file: ../.env
    # 80 · 443을 여는 권한만 남깁니다
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 200
    depends_on:
      shrine:
        condition: service_healthy
    logging: *logging

volumes:
  shrine-data:
  caddy-data:
  caddy-config:
  caddy-logs:
